<script>

    document.documentElement.setAttribute('data-theme', t);

<style>
  /* ========== Tema değişkenleri ========== */
  :root[data-theme="light"] {
    --bg-page:#f8fafc; --bg-card:#fff; --bg-input:#fff;
    --bg-soft:#f1f5f9; --bg-hover:#e2e8f0; --bg-nav:#fff;

    --brand-bg:#185FA5; --brand-bg-hover:#0C447C;
    --brand-soft:#E6F1FB; --brand-soft-text:#0C447C;
    --success-bg:#dcfce7; --success-text:#166534; --success-border:#86efac;
    --warning-bg:#fef3c7; --warning-text:#92400e; --warning-border:#fcd34d;
    --danger-bg:#fee2e2;  --danger-text:#991b1b;  --danger-border:#fca5a5;
    --info-bg:#dbeafe;    --info-text:#1e40af;    --info-border:#93c5fd;

  :root[data-theme="dark"] {

    --bg-soft:#1f2937; --bg-hover:#374151; --bg-nav:#111827;
    --bg-overlay:rgba(0,0,0,.6);
    --text-primary:#f1f5f9; --text-secondary:#cbd5e1;
    --text-muted:#94a3b8; --text-faint:#64748b;
    --border:#1f2937; --border-strong:#374151;
    --brand-bg:#378ADD; --brand-bg-hover:#5a9fe8;
    --brand-soft:#0C447C; --brand-soft-text:#B5D4F4;
    --success-bg:rgba(22,101,52,.25); --success-text:#86efac; --success-border:#166534;
    --warning-bg:rgba(146,64,14,.25); --warning-text:#fcd34d; --warning-border:#92400e;
    --danger-bg:rgba(153,27,27,.25);  --danger-text:#fca5a5;  --danger-border:#991b1b;

  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  input:disabled,textarea:disabled,select:disabled{opacity:.6;cursor:not-allowed}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;

       cursor:pointer;border:1px solid transparent;transition:all .15s;

  .btn-primary{background:var(--brand-bg);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--brand-bg-hover);color:#fff}

  .btn-secondary:hover:not(:disabled){background:var(--bg-hover)}
  .btn-danger{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border)}
  .btn-success{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border)}

  .badge-success{background:var(--success-bg);color:var(--success-text)}
  .badge-warning{background:var(--warning-bg);color:var(--warning-text)}
  .badge-danger{background:var(--danger-bg);color:var(--danger-text)}
  .badge-info{background:var(--info-bg);color:var(--info-text)}

  .alert{padding:12px 16px;border-radius:8px;border:1px solid;font-size:14px;margin-bottom:12px}

  .alert-warning{background:var(--warning-bg);color:var(--warning-text);border-color:var(--warning-border)}
  .alert-error{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border)}

</style>

<script>
// ============================================================
//                       YAPILANDIRMA

// Supabase Dashboard → Settings → API'den al
const SUPABASE_URL  = 'https://dglqdanufegfaqkbgeig.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_xLcpPKMCULo9D2yMfEeSfg__y4Sm-Ei';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
//                       GLOBAL STATE
// ============================================================
let currentUser = null;
let currentProfile = null;
let appSettings = {};

// ============================================================
//                       UTILITY
// ============================================================
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtMoney(n) {
  return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n));
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function fmtShortDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('tr-TR');
}

function timeAgo(d) {
  const sec = (Date.now() - new Date(d).getTime()) / 1000;
  if (sec < 60) return 'Az önce';
  if (sec < 3600) return Math.floor(sec / 60) + ' dk önce';
  if (sec < 86400) return Math.floor(sec / 3600) + ' saat önce';
  if (sec < 86400 * 7) return Math.floor(sec / 86400) + ' gün önce';
  return fmtShortDate(d);
}

function flash(type, msg) {
  const area = $('#flash-area');
  const cls = { success:'alert-success', error:'alert-error', warning:'alert-warning', info:'alert-info' }[type] || 'alert-info';
  const div = document.createElement('div');
  div.className = 'alert ' + cls;
  div.textContent = msg;
  area.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}

// ============================================================
//                       PIN ÜRETİM ALGORİTMASI
// ============================================================
function generateLocations(centerLat, centerLng, radiusKm, count) {
  const out = [];
  const degPerKm = 1 / 111.32;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const dist  = Math.sqrt(Math.random()) * radiusKm;
    const dLat  = dist * degPerKm * Math.sin(angle);
    const dLng  = dist * degPerKm * Math.cos(angle) / Math.cos(centerLat * Math.PI / 180);
    out.push({
      lat: +(centerLat + dLat).toFixed(7),
      lng: +(centerLng + dLng).toFixed(7),
    });
  }
  return out;
}

function buildCsv(job) {
  const rows = [
    ['store_code','business_name','description','phone','website','latitude','longitude','keywords']
  ];
  const slug = (job.business_name || 'biz')
    .toLowerCase()
    .replace(/[şŞ]/g,'s').replace(/[ıİ]/g,'i').replace(/[ğĞ]/g,'g')
    .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
    .replace(/[^a-z0-9]+/g,'').slice(0, 12) || 'biz';
  job.locations.forEach((loc, i) => {
    rows.push([
      `${slug}-${String(i + 1).padStart(3, '0')}`,
      job.business_name || '',
      job.description || '',
      job.phone || '',
      job.website || '',
      loc.lat,
      loc.lng,
      job.keywords || '',
    ]);
  });
  // CSV escape
  return '\uFEFF' + rows.map(r => r.map(field => {
    const s = String(field ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
}

function downloadCsv(job) {
  const csv = buildCsv(job);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pin-${job.id}-${(job.business_name || 'isletme').replace(/[^a-z0-9]/gi,'-').toLowerCase()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadCurrentUser() {
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  if (user) {
    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
    currentProfile = profile;
  } else {
    currentProfile = null;
  }
  updateNavUI();
}

function updateNavUI() {
  const userNav = $('#topnav');
  const guestNav = $('#guestnav');
  const fab = $('#whatsapp-fab');

  if (currentUser && currentProfile && currentProfile.status === 'active') {
    userNav.style.display = 'block';

// ============================================================
//                       ROUTER
// ============================================================
const routes = {};

function route(name, render) {
  routes[name] = render;
}

async function go(name, params = {}) {
  // Hash'i güncelle
  const hash = name + (Object.keys(params).length ? '?' + new URLSearchParams(params) : '');
  if (location.hash !== '#' + hash) {
    history.pushState({}, '', '#' + hash);
  }

  // Active nav
  $$('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.page === name.split('/')[0]));

  // Auth kontrolleri
  const guestOnly = ['login', 'register', 'forgot', 'verify-email'];
  const userRequired = ['dashboard','create-pin','history','buy-credits','payment','settings','admin'];
  const adminRequired = ['admin'];

  if (!currentUser) {
    if (userRequired.some(p => name.startsWith(p))) {
      flash('warning', 'Devam etmek için giriş yapmalısın.');
      return go('login');
    }
  } else {
    if (currentProfile && currentProfile.status !== 'active' && !guestOnly.includes(name)) {
      // Suspended/banned → otomatik çıkış
      if (currentProfile.status === 'banned' || currentProfile.status === 'suspended') {
        flash('error', currentProfile.status === 'banned' ? 'Hesabın kapatılmış.' : 'Hesabın askıya alınmış.');
        await signOut();
        return;
      }
    }
    if (guestOnly.includes(name)) {
      return go('dashboard');
    }
    if (adminRequired.some(p => name.startsWith(p)) && currentProfile?.role !== 'admin') {
      flash('error', 'Yetkisiz erişim.');
      return go('dashboard');
    }
  }

  // Render
  const container = $('#page-container');
  container.innerHTML = '<div class="text-center"><div class="spinner"></div></div>';

  // Bildirim panelini kapat
  $('#notif-panel').style.display = 'none';

  try {
    const fn = routes[name.split('/')[0]] || routes['login'];
    await fn(container, params);
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div class="alert alert-error">Hata: ' + escapeHtml(err.message) + '</div>';
  }

  window.scrollTo(0, 0);
}

window.addEventListener('popstate', () => parseHash());

function parseHash() {
  const h = location.hash.replace(/^#/, '') || (currentUser ? 'dashboard' : 'login');
  const [name, qs] = h.split('?');
  const params = qs ? Object.fromEntries(new URLSearchParams(qs)) : {};
  go(name, params);
}

route('payment', async (c, params) => {
  const pkgId = parseInt(params.pkg);
  const { data: pkg } = await sb.from('credit_packages').select('*').eq('id', pkgId).single();
  if (!pkg) {
    flash('error', 'Geçersiz paket.');
    return go('buy-credits');
  }

  const step = params.step || 'method';
  const payId = params.id ? parseInt(params.id) : null;
  let payment = null;
  if (payId) {
    const { data } = await sb.from('payments').select('*').eq('id', payId).eq('user_id', currentUser.id).single();
    payment = data;
  }

  if (step === 'method') {
    c.innerHTML = `
      <a href="#buy-credits" class="text-sm text-secondary mb-3" style="display:inline-block">← Paketler</a>
      <h1>Ödeme</h1>
      <p class="text-secondary text-sm mb-6">
        <strong>${escapeHtml(pkg.name)}</strong> · ${pkg.credits} hak · <strong>${fmtMoney(pkg.price_try)} ₺</strong>
      </p>
      <form id="method-form" class="card">
        <h3>Ödeme yöntemi seç</h3>
        ${[
          ['havale', 'Havale / EFT', 'Bankadan IBAN\'a transfer yap, dekont yükle, onayla.'],
          ['whatsapp', 'WhatsApp', 'WhatsApp\'tan iletişime geç, ödeme linki al.'],
          ['link', 'Ödeme linki', 'Talep oluştur, sana ödeme linki gönderelim.'],
        ].map(([v, t, d], i) => `
          <label style="display:block;padding:16px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer">
            <input type="radio" name="method" value="${v}" ${i===0?'checked':''} style="width:auto;margin-right:8px">
            <strong>${t}</strong>
            <div class="text-sm text-secondary" style="margin-left:22px">${d}</div>
          </label>
        `).join('')}
        <button class="btn btn-primary btn-block mt-4">Devam et</button>
      </form>`;

    $('#method-form').addEventListener('submit', async e => {
      e.preventDefault();
      const method = new FormData(e.target).get('method');
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'İşleniyor...';

      const { data, error } = await sb.rpc('create_payment_request', {
        p_package_id: pkg.id,
        p_method: method,
      });
      if (error) { flash('error', error.message); btn.disabled=false; btn.textContent='Devam et'; return; }

      if (method === 'whatsapp') {
        const wa = (appSettings.whatsapp_number || '').replace(/\D/g, '');
        const msg = encodeURIComponent(`Merhaba, ${pkg.name} paketi (${pkg.credits} hak / ${pkg.price_try} TL) için ödeme yapmak istiyorum. Referans: ${data.reference_code}`);
        if (wa) window.open(`https://wa.me/${wa}?text=${msg}`, '_blank');
      }
      go('payment', { pkg: pkg.id, step: 'upload', id: data.id });
    });
  }
  else if (step === 'upload' && payment) {
    c.innerHTML = `
      <a href="#buy-credits" class="text-sm text-secondary mb-3" style="display:inline-block">← Paketler</a>
      <h1>Ödeme</h1>
      <div class="alert alert-info">
        <strong>Referans kodun:</strong> <span style="font-family:monospace">${escapeHtml(payment.reference_code)}</span>
        — havale açıklamasına bunu yaz.
      </div>
      <div class="card mb-4">
        <h3>Banka bilgileri</h3>
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;font-size:14px">
          <div class="text-secondary">Banka</div><div><strong>${escapeHtml(appSettings.bank_name || '—')}</strong></div>
          <div class="text-secondary">Hesap sahibi</div><div><strong>${escapeHtml(appSettings.bank_account_holder || '—')}</strong></div>
          <div class="text-secondary">IBAN</div><div style="font-family:monospace"><strong>${escapeHtml(appSettings.bank_iban || '—')}</strong></div>
          <div class="text-secondary">Tutar</div><div><strong>${fmtMoney(pkg.price_try)} ₺</strong></div>
          <div class="text-secondary">Açıklama</div><div style="font-family:monospace"><strong>${escapeHtml(payment.reference_code)}</strong></div>
        </div>
      </div>
      <form id="upload-form" class="card">
        <h3>Dekont yükle</h3>
        <p class="text-secondary text-sm mb-3">Transferi yaptıktan sonra dekontunu yükle.</p>
        <label class="file-drop" id="drop">
          <input type="file" id="receipt-input" accept=".jpg,.jpeg,.png,.webp,.pdf" required style="display:none">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-faint);margin-bottom:8px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div style="font-weight:500" id="drop-text">Dosya seç veya buraya sürükle</div>
          <div class="text-xs text-faint">JPG, PNG, WebP veya PDF · max 5 MB</div>
        </label>
        <div class="mt-4">
          <label class="label">Not (opsiyonel)</label>
          <input id="note" placeholder="Eklemek istediğin not...">
        </div>
        <button class="btn btn-primary btn-block mt-4">Dekontu gönder</button>
      </form>`;

    const drop = $('#drop'), inp = $('#receipt-input'), txt = $('#drop-text');
    drop.addEventListener('click', () => inp.click());
    inp.addEventListener('change', () => {
      if (inp.files[0]) txt.textContent = inp.files[0].name;
    });
    ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.style.borderColor = 'var(--brand-bg)';
    }));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.style.borderColor = '';
      if (e.dataTransfer.files[0]) {
        inp.files = e.dataTransfer.files;
        txt.textContent = inp.files[0].name;
      }
    });

    $('#upload-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!inp.files[0]) return flash('error', 'Dosya seçmedin.');
      if (inp.files[0].size > 5 * 1024 * 1024) return flash('error', 'Dosya 5 MB üzerinde.');

      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Yükleniyor...';

      const file = inp.files[0];
      const ext = file.name.split('.').pop().toLowerCase();
      const path = `${currentUser.id}/p${payment.id}-${Date.now()}.${ext}`;

      const { error: upErr } = await sb.storage.from('receipts').upload(path, file);
      if (upErr) { flash('error', upErr.message); btn.disabled=false; btn.textContent='Dekontu gönder'; return; }

      const { error: updErr } = await sb.from('payments').update({
        receipt_path: path,
        user_note: $('#note').value.trim() || null,
      }).eq('id', payment.id);

      if (updErr) { flash('error', updErr.message); btn.disabled=false; btn.textContent='Dekontu gönder'; return; }

      go('payment', { pkg: pkg.id, step: 'done', id: payment.id });
    });
  }
  else if (step === 'done' && payment) {
    c.innerHTML = `
      <div class="card text-center" style="padding:48px 24px;max-width:500px;margin:0 auto">
        <div style="display:inline-flex;width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success-text);align-items:center;justify-content:center;margin-bottom:16px">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Dekont alındı</h2>
        <p>Onaylandığında <strong>${pkg.credits} hak</strong> hesabına eklenecek ve sana bildirim göndereceğiz.</p>
        <p class="text-faint text-xs">Referans: <span style="font-family:monospace">${escapeHtml(payment.reference_code)}</span></p>
        <div class="flex gap-2 justify-center mt-4" style="flex-wrap:wrap">
          <a href="#dashboard" class="btn btn-primary">Panele dön</a>
          <a href="#buy-credits" class="btn btn-secondary">Ödemelerim</a>
        </div>
      </div>`;
  }
});

          </div>
          <div class="flex items-center gap-3 mb-3" style="flex-wrap:wrap">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_popular" ${p.is_popular?'checked':''} style="width:auto"> Popüler</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_active" ${p.is_active?'checked':''} style="width:auto"> Aktif</label>
          </div>
          <button class="btn btn-primary">Kaydet</button>
        </form>
      `).join('')}`;

    $('#new-pkg').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const { error } = await sb.from('credit_packages').insert({
        name: fd.get('name'),
        credits: parseInt(fd.get('credits')),
        price_try: parseFloat(fd.get('price_try')),
        is_popular: fd.has('is_popular'),
        sort_order: parseInt(fd.get('sort_order') || 0),
      });
      if (error) return flash('error', error.message);
      flash('success', 'Paket eklendi.');
      go('admin', { tab: 'packages' });
    });

    $$('.pkg-form').forEach(f => f.addEventListener('submit', async e => {
      e.preventDefault();
      const id = parseInt(f.dataset.id);
      const fd = new FormData(f);
      const { error } = await sb.from('credit_packages').update({
        name: fd.get('name'),
        credits: parseInt(fd.get('credits')),
        price_try: parseFloat(fd.get('price_try')),
        sort_order: parseInt(fd.get('sort_order') || 0),
        is_popular: fd.has('is_popular'),
        is_active: fd.has('is_active'),
      }).eq('id', id);
      if (error) return flash('error', error.message);
      flash('success', 'Güncellendi.');
    }));
  }
  else if (tab === 'settings') {
    const fields = [
      ['site_name', 'Site adı'],
      ['whatsapp_number', 'WhatsApp (905xxxxxxxxx)'],
      ['bank_name', 'Banka adı'],
      ['bank_account_holder', 'Hesap sahibi'],
      ['bank_iban', 'IBAN'],
      ['support_email', 'Destek e-posta'],
    ];
    c.innerHTML = `${tabs}
      <h1>Site ayarları</h1>
      <form id="set-form" class="card">
        ${fields.map(([k, l]) => `
          <div class="mb-3">
            <label class="label">${l}</label>
            <input name="${k}" value="${escapeHtml(appSettings[k] || '')}">
          </div>
        `).join('')}
        <button class="btn btn-primary">Tümünü kaydet</button>
      </form>`;

    $('#set-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const updates = [];
      for (const [k] of fields) updates.push({ key: k, value: fd.get(k) });
      const { error } = await sb.from('settings').upsert(updates);
      if (error) return flash('error', error.message);
      await loadSettings();
      flash('success', 'Ayarlar güncellendi.');
    });
  }
});

// Admin yardımcılar
window.editUser = function(u) {
  // Modal yerine basit prompt — geliştirilebilir
  const credits = prompt(`${u.first_name} ${u.last_name} için yeni hak sayısı:`, u.credits);
  if (credits === null) return;
  const status = prompt(`Durum (active/suspended/banned):`, u.status);
  if (status === null) return;
  sb.rpc('admin_update_user', {
    p_user_id: u.id,
    p_credits: parseInt(credits),
    p_status: status,
  }).then(({ error }) => {
    if (error) return flash('error', error.message);
    flash('success', 'Güncellendi.');
    go('admin', { tab: 'users' });
  });
};

window.approvePayment = async function(id) {
  const note = $(`#note-${id}`)?.value || '';
  const { error } = await sb.rpc('admin_approve_payment', { p_payment_id: id, p_note: note || null });
  if (error) return flash('error', error.message);
  flash('success', 'Ödeme onaylandı.');
  go('admin', { tab: 'payments' });
};

window.rejectPayment = async function(id) {
  if (!confirm('Reddedilecek. Emin misin?')) return;
  const note = $(`#note-${id}`)?.value || '';
  const { error } = await sb.rpc('admin_reject_payment', { p_payment_id: id, p_note: note || null });
  if (error) return flash('error', error.message);
  flash('success', 'Ödeme reddedildi.');
  go('admin', { tab: 'payments' });
};

window.viewReceipt = async function(path) {
  const { data, error } = await sb.storage.from('receipts').createSignedUrl(path, 60);
  if (error) return flash('error', error.message);
  window.open(data.signedUrl, '_blank');
};

// ============================================================
//                       BİLDİRİMLER
// ============================================================
async function loadNotifCount() {
  if (!currentUser) return;
  const { count } = await sb.from('notifications')
    .select('*', { count: 'exact', head: true })
    .eq('user_id', currentUser.id).eq('is_read', false);
  const dot = $('#notif-count');
  if (count > 0) {
    dot.style.display = 'flex';
    dot.textContent = count > 9 ? '9+' : count;
  } else {
    dot.style.display = 'none';
  }
}

window.toggleNotifs = async function(e) {
  e?.stopPropagation();
  const p = $('#notif-panel');
  if (p.style.display === 'none' || !p.style.display) {
    const { data } = await sb.from('notifications')
      .select('*').eq('user_id', currentUser.id)
      .order('id', { ascending: false }).limit(20);
    if (!data || data.length === 0) {
      p.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-faint);font-size:13px">Henüz bildirim yok</div>';
    } else {
      p.innerHTML = `
        <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <strong style="font-size:14px">Bildirimler</strong>
          <button onclick="markAllRead()" class="text-xs" style="background:none;border:none;color:var(--brand-bg);cursor:pointer">Tümünü oku</button>
        </div>
        ${data.map(n => `
          <div class="notif-item ${n.is_read ? '' : 'unread'}">
            <div style="font-weight:500;margin-bottom:2px">${escapeHtml(n.title)}</div>
            ${n.body ? `<div style="color:var(--text-muted);font-size:12px">${escapeHtml(n.body)}</div>` : ''}
            <div style="color:var(--text-faint);font-size:11px;margin-top:4px">${timeAgo(n.created_at)}</div>
          </div>
        `).join('')}`;
    }
    p.style.display = 'block';
  } else {
    p.style.display = 'none';
  }
};

window.markAllRead = async function() {
  await sb.from('notifications').update({ is_read: true })
    .eq('user_id', currentUser.id).eq('is_read', false);
  await loadNotifCount();
  $('#notif-panel').style.display = 'none';
};

document.addEventListener('click', e => {
  const w = $('#notif-wrap');
  if (w && !w.contains(e.target)) $('#notif-panel').style.display = 'none';
});

// Periyodik bildirim yenile
setInterval(loadNotifCount, 60000);

// ============================================================
//                       BAŞLAT
// ============================================================
$('#year').textContent = new Date().getFullYear();

(async () => {
  await loadSettings();
  await loadCurrentUser();
  await loadNotifCount();

  // auth değişikliklerinde dinle
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' || event === 'SIGNED_IN' || event === 'USER_UPDATED') {
      loadCurrentUser().then(loadNotifCount).then(parseHash);
    }
  });

  parseHash();
})();
</script>
